services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-18293}:3000"
    volumes:
      - storage:/app/storage
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crewmed-backend.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.crewmed-backend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.crewmed-backend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.crewmed-backend.loadbalancer.server.port=3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL}"
    ports:
      - "${FRONTEND_PORT:-8099}:80"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crewmed-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.crewmed-frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.crewmed-frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.crewmed-frontend.loadbalancer.server.port=80"
    restart: unless-stopped
    depends_on:
      - backend

networks:
  traefik:
    name: "${TRAEFIK_NETWORK:-traefik-public}"
    external: true

volumes:
  storage:
