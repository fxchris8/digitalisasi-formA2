server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # Serve favicon/logo requests directly
    location = /favicon.ico {
        try_files /favicon.ico /logo.ico =404;
    }

    # Cache agresif untuk static assets yang sudah di-hash oleh Vite
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — semua route non-file di-serve ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
